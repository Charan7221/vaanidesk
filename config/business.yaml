# Business profile used by the AI receptionist.
# Edit this file to adapt VaaniDesk to any clinic, salon, restaurant or office.

name: "Sunrise Family Clinic"
assistant_name: "Vaani"
timezone: "Asia/Kolkata"
address: "12-4-56, MG Road, Vizianagaram, Andhra Pradesh"
phone: "+91 90000 00000"

# Languages the assistant may speak. First one is the default greeting language.
languages: ["en-IN", "hi-IN", "te-IN"]
# How the call opens:
#   full  -> the same greeting in every language above (English, then Hindi, then Telugu)
#   short -> greeting in one language + "you can also speak Hindi / Telugu" in those languages
#   off   -> one language only
multilingual_greeting: full

# Appointment settings
slot_minutes: 20
booking_horizon_days: 14

# Opening hours per weekday (24h clock). Omit a day or use [] to mark it closed.
hours:
  mon: [["09:00", "13:00"], ["17:00", "20:00"]]
  tue: [["09:00", "13:00"], ["17:00", "20:00"]]
  wed: [["09:00", "13:00"], ["17:00", "20:00"]]
  thu: [["09:00", "13:00"], ["17:00", "20:00"]]
  fri: [["09:00", "13:00"], ["17:00", "20:00"]]
  sat: [["09:00", "13:00"]]
  sun: []

# Departments: the receptionist matches what a caller describes ("sugar is high", "my son has a cough")
# against `treats` to suggest the right doctor. Write problems in simple English; callers can speak any
# supported language (the agent translates). age_min / age_max / gender route children and women correctly.
departments:
  - id: "general-medicine"
    name: "General Medicine"
    default: true            # anything that doesn't match another department starts here
    age_min: 15
    consultation_fee: 400
    treats: [fever, cold, cough, body pain, headache, diabetes, sugar, blood pressure, bp, thyroid,
             stomach pain, acidity, vomiting, loose motions, diarrhoea, weakness, tiredness, infection,
             allergy, skin rash, joint pain, back pain, health check-up, cholesterol, urine infection]
  - id: "paediatrics"
    name: "Paediatrics (children up to 14 years)"
    age_max: 14
    consultation_fee: 450
    treats: [child, baby, newborn, infant, kid, son, daughter, vaccination, vaccine, growth, feeding,
             child fever, child cough]

# Consultation fees. A repeat visit to the same department within follow_up_days costs follow_up_fee.
fees:
  currency: "₹"
  consultation_fee: 400
  follow_up_days: 7
  follow_up_fee: 0           # free follow-up

providers:
  - id: "dr-rao"
    name: "Dr. Srinivasa Rao"
    specialty: "General Physician"
    department: "general-medicine"
  - id: "dr-lakshmi"
    name: "Dr. Lakshmi Devi"
    specialty: "Paediatrician"
    department: "paediatrics"

services:
  - name: "General consultation"
    price: "₹400"
  - name: "Child consultation"
    price: "₹450"
  - name: "Follow-up visit (within 7 days)"
    price: "Free"

faq:
  - q: "Do you accept walk-ins?"
    a: "Yes, but patients with appointments are seen first, so booking is recommended."
  - q: "Is parking available?"
    a: "Yes, free two-wheeler and car parking is available in front of the clinic."
  - q: "Which payment methods do you accept?"
    a: "Cash, UPI and all major cards."
  - q: "Do you have a lab?"
    a: "Basic blood tests are done at the clinic; samples are collected from 8 AM."

# ---- Pilot / production safety
# pilot_mode: AI bookings and tokens stay "pending" until staff press Confirm on the dashboard
# (start every new clinic in pilot mode; switch off once staff trust the bookings).
pilot_mode: false
consent_notice: true             # the greeting says it's an AI assistant and the call is transcribed
transcript_retention_days: 90    # delete call transcripts and summaries after this many days (0 = keep)
staff_alert_phone: ""            # SMS/WhatsApp for new follow-ups (empty = handoff_number)
reminders:                       # WhatsApp/SMS the evening before each appointment / OPD token
  enabled: true
  send_at: "18:00"

# Where to transfer the call when the caller asks for a human or it's an emergency.
handoff_number: "+919000000000"
# Ambulance number callers are told to dial first in a medical emergency.
emergency_number: "108"

# Extra instructions for the assistant's behaviour.
policies:
  - "Never give medical advice or diagnoses. For emergencies, tell the caller to call 108 immediately."
  - "Confirm the caller's name, date and time before booking."
  - "Keep each reply short: one or two sentences, because this is a phone call."

# Walk-in OPD (outpatient) tokens. Each opening window above is one OPD session per doctor
# (e.g. morning 09:00-13:00 and evening 17:00-20:00). Callers can take a token number by phone,
# ask how many patients are ahead of them, and staff run the queue from the dashboard's OPD page.
opd:
  enabled: true
  avg_consult_minutes: 10       # used for the estimated waiting time
  max_tokens_per_session: 40    # per doctor, per session
  stop_before_end_minutes: 30   # no new tokens in the last 30 minutes of a session
  advance_days: 2               # tokens for today and the next 2 days
