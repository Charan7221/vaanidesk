# Retrieval eval: does search put the right passage in front of the agent?
# Run:  python -m evals.retrieval      (vector modes need an embedding model; keyword mode runs offline)
#
# expect: citation(s) that answer the question (any one counts).
# "paraphrase" questions avoid the documents' wording on purpose; Hindi/Telugu questions are asked
# as the caller would say them (the live agent translates to English first, but retrieval should cope).

- {q: "Do I need to fast before a blood sugar test?", lang: en, expect: ["lab-tests.md › Preparing for a test"]}
- {q: "Do you accept cashless insurance?", lang: en, expect: ["insurance.md › Cashless treatment"]}
