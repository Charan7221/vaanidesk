[project]
name = "vaanidesk"
version = "1.0.0"
description = "Real-time multilingual voice AI receptionist (English, Hindi, Telugu) with Twilio, Deepgram/Sarvam, OpenAI"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B027"]  # B027: optional no-op hooks on Transport are intentional
